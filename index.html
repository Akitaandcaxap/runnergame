</style></head><body>

<div id="spawnMenu"><h1>🔧 СПАВН</h1><div class="spawn-section"><h3>ПРЕГРАДЫ</h3><div class="spawn-row"><button data-spawn="plat">Платформа</button><button data-spawn="plat_tall">Столб</button></div></div><div class="spawn-section"><h3>ДЕКОРАЦИИ</h3><div class="spawn-row"><button data-spawn="tree">Дерево</button><button data-spawn="house">Дом</button><button data-spawn="well">Колодец</button></div></div><div class="spawn-section"><h3>МОБЫ</h3><div class="spawn-row"><button data-spawn="zombie">Зомби</button><button data-spawn="flyer">Летун</button><button data-spawn="tank">Танк</button></div></div><div class="spawn-section"><h3>ОРУЖИЕ</h3><div class="spawn-row"><button data-spawn="sg">Дроб</button><button data-spawn="awp">AWP</button><button data-spawn="pistol">Пист</button></div></div><div class="spawn-section"><h3>ПРОЧЕЕ</h3><div class="spawn-row"><button data-spawn="heal">Хилка</button></div></div><button id="spawnClose">ЗАКРЫТЬ (Q)</button></div>
<div id="touchControls"><div class="tc-dpad"><button class="tc-btn" data-key="ArrowLeft">◄</button><button class="tc-btn" data-key="ArrowRight">►</button></div><div class="tc-actions"><button class="tc-btn tc-jump" data-key="KeyZ">ПРЫЖОК</button><button class="tc-btn tc-attack" data-key="KeyX">АТАКА</button><button class="tc-btn tc-parry" data-key="KeyC">ПАРИР</button><button class="tc-btn tc-shift" data-key="ShiftLeft">РАЗГОН</button><button class="tc-btn tc-save" data-key="KeyE">СЕЙВ</button></div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');let W,H;
function rs(){W=C.width=innerWidth;H=C.height=innerHeight}rs();
addEventListener('resize',()=>{rs();initFg();initBg()});
let K={},sh=false,G=1.05,started=false,over=false,paused=false,saveDialogOpen=false,spawnMenuOpen=false,sandboxMode=false,tutorialMode=false,touchMode=false,shake=0,score=0,killScore=0,gy,cam={x:0,y:0},lastCamX=0,lastBgCamX=0;
let pl=[],en=[],bul=[],eb=[],pt=[],pk=[],hl=[],rag=[],atm=[],fg=[],bg=[],decos=[];
let fgSpacing=400,bgSpacing=500;
let maxX=0,genX=0,lastEnemy=0,lastLoot=0,lastHeal=0,biomeIdx=0,biomeEnd=0;
let savedHutX=-1,hutTarget=null;
let boss=null,bossSpawned=false;
let tutorialStep=0,tutorialStepTime=0,tutorialFlags={};
const HUT_DIST=50000,BOSS_AT=15000,BOSS_LEN=50000;
const TUT_MSGS=[
  '→ БЕГ ВПЕРЁД: зажми стрелку ВПРАВО',
  'Z ПРЫЖОК: нажми Z',
  'SHIFT РАЗГОН: удерживай SHIFT при движении',
  'БАНИХОП: прыгай сразу после приземления (Z-Z-Z)',
  'РЫВОК: нажми X без оружия',
  'ПАРИРОВАНИЕ: нажми C',
  'ПОДБОР: иди к пистолету впереди',
  'ВЫСТРЕЛ: нажми X с пистолетом',
  'ОДНОРАЗОВОЕ: оружие выпадает после выстрелов',
  '🎉 ГОТОВО! ESC → пауза → в меню'
];
const P={x:80,y:0,vx:0,vy:0,w:24,h:52,f:1,g:false,hp:100,mhp:100,wt:0,ws:0,dcd:0,hf:0,pt:0,iv:0,dashTime:0,dashHits:[],bh:0,bhT:0,deadT:0};
let cw=null,lastShot=0;
let AC,musicGain,sfxGain,musicMode='none',musicTimer=null,musicIdx=0,bossDrone=null;
const BM=[
{n:'ЛЕС',s1:'#5a7a52',s2:'#8fa885',gr:'#4a6640',br:'#7a6548',at:'leaf',fg:['tree','bush','tree','bush'],bg:['house','well','fence','house']},
{n:'СНЕЖНАЯ ПУСТОШЬ',s1:'#a8bcc8',s2:'#d8e2e8',gr:'#98a8b0',br:'#8a9aa5',at:'snow',fg:['snowtree','snowmound','snowtree','snowmound'],bg:['cabin','signpost','cabin','signpost']},
{n:'БОЛОТО',s1:'#4a5a3a',s2:'#6a7a55',gr:'#3a4a2a',br:'#4f5a3a',at:'fly',fg:['reed','deadtree','reed','reed'],bg:['stilthouse','deadwell','fence','stilthouse']},
{n:'ПУСТЫНЯ',s1:'#c8b888',s2:'#e0d4a8',gr:'#b0a070',br:'#988558',at:'sand',fg:['cactus','rock','cactus','skull'],bg:['adobe','well','barrel','adobe']},
{n:'ВУЛКАН',s1:'#5a3a3a',s2:'#7a4a45',gr:'#4a3030',br:'#5a4040',at:'ember',fg:['lavaRock','obsidian','lavaRock','obsidian'],bg:['ruin','pillar','ruin','pillar']},
{n:'НОЧЬ',s1:'#1a2a4a',s2:'#2a3a5a',gr:'#1a2030',br:'#2a3045',at:'star',fg:['darktree','tomb','darktree','tomb'],bg:['cabin','lamppost','well','cabin']}
];
const WP={sg:{n:'ДРОБ',a:1,sp:.20,pel:8,dm:8,rc:20,fr:500,col:'#8a5a2b',ln:30},awp:{n:'AWP',a:1,sp:.01,pel:1,dm:120,rc:55,fr:900,col:'#2f8f2f',ln:42},pistol:{n:'ПИСТ',a:3,sp:.03,pel:1,dm:16,rc:4,fr:200,col:'#666',ln:16}};
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();musicGain=AC.createGain();musicGain.connect(AC.destination);musicGain.gain.value=0.7;sfxGain=AC.createGain();sfxGain.connect(AC.destination);sfxGain.gain.value=0.8;}catch(e){console.warn('Audio fail',e);}}
function playNote(freq,dur,wave,vol){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=wave;o.frequency.value=freq;const t=AC.currentTime;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+dur+0.01);}
function loopNormal(){if(!AC||musicMode!=='normal')return;const n=[220,262,330,262,196,262,294,262];playNote(n[musicIdx%8],0.42,'sine',0.15);playNote(n[musicIdx%8]*0.5,0.42,'triangle',0.06);musicIdx++;musicTimer=setTimeout(loopNormal,450);}
function loopBoss(){if(!AC||musicMode!=='boss')return;const n=[110,110,146,110,165,110,146,130];playNote(n[musicIdx%8],0.16,'sawtooth',0.15);if(musicIdx%2===0)playNote(n[musicIdx%8]*2,0.1,'square',0.07);musicIdx++;musicTimer=setTimeout(loopBoss,180);}
function startMusic(m){if(musicTimer){clearTimeout(musicTimer);musicTimer=null;}musicMode=m;if(!AC||m==='none')return;if(m==='normal')loopNormal();else if(m==='boss')loopBoss();}
function startBossDrone(){if(!AC||bossDrone)return;const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=55;g.gain.value=0.05;o.connect(g);g.connect(musicGain);o.start();bossDrone={o,g};}
function stopBossDrone(){if(!bossDrone)return;try{bossDrone.o.stop();}catch(e){}bossDrone=null;}
function sfx(kind){if(!AC)return;const t=AC.currentTime;const mk=(fs,fe,dur,wv,vol)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=wv;o.frequency.setValueAtTime(fs,t);if(fe)o.frequency.exponentialRampToValueAtTime(Math.max(1,fe),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+dur+0.01);};
  if(kind==='shoot')mk(600,150,0.1,'square',0.2);else if(kind==='jump')mk(300,600,0.12,'sine',0.15);else if(kind==='hurt')mk(150,60,0.22,'sawtooth',0.25);else if(kind==='hit')mk(400,400,0.06,'square',0.12);
  else if(kind==='enemyHit')mk(280,180,0.09,'square',0.18);else if(kind==='dashHit')mk(180,90,0.15,'sawtooth',0.22);
  else if(kind==='kill')mk(200,40,0.3,'sawtooth',0.22);else if(kind==='boss')mk(50,30,0.6,'sawtooth',0.35);else if(kind==='parry')mk(800,1200,0.12,'sine',0.15);
  else if(kind==='heal'){[523,659,784].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;const tt=t+i*0.06;g.gain.setValueAtTime(0.0001,tt);g.gain.exponentialRampToValueAtTime(0.15,tt+0.02);g.gain.exponentialRampToValueAtTime(0.0001,tt+0.2);o.connect(g);g.connect(sfxGain);o.start(tt);o.stop(tt+0.21);});}
}
function banner(){if(!started)return;const b=document.getElementById('banner');b.textContent=BM[biomeIdx].n;b.style.color='#fff';b.style.opacity='1';setTimeout(()=>{b.style.opacity='0';},2500);}
function initFg(){fg=[];const pat=BM[biomeIdx].fg;fgSpacing=W/Math.max(2,pat.length-1);for(let i=0;i<pat.length;i++)fg.push({x:i*fgSpacing,sy:H*0.82,size:95+Math.random()*30,type:pat[i]});}
function initBg(){bg=[];const pat=BM[biomeIdx].bg;bgSpacing=W*0.65;for(let i=0;i<pat.length;i++)bg.push({x:i*bgSpacing+Math.random()*40,type:pat[i],size:80+Math.random()*50});}
function bl(){
  pl=[];en=[];bul=[];eb=[];pt=[];pk=[];hl=[];rag=[];atm=[];decos=[];
  score=0;killScore=0;over=false;paused=false;saveDialogOpen=false;spawnMenuOpen=false;
  genX=200;lastEnemy=600;lastLoot=400;lastHeal=800;
  cw=null;K={};sh=false;savedHutX=-1;hutTarget=null;shake=0;acc=0;lastT=0;
  boss=null;bossSpawned=false;
  tutorialStep=0;tutorialStepTime=0;tutorialFlags={jumped:false,sprinted:false,bunny:false,dashed:false,parried:false,picked:false,fired:false};
  document.getElementById('hutPrompt').style.display='none';
  document.getElementById('pauseMenu').style.display='none';
  document.getElementById('saveDialog').style.display='none';
  document.getElementById('spawnMenu').style.display='none';
  document.getElementById('bossBar').classList.remove('active');
  document.getElementById('sandboxLabel').classList.toggle('active',sandboxMode);
  stopBossDrone();
  gy=H+100;
  if(tutorialMode){
    P.x=100;P.y=gy-P.h;P.vx=0;P.vy=0;P.g=true;P.hp=100;P.iv=60;P.f=1;P.dashTime=0;P.dashHits=[];P.bh=0;P.bhT=0;P.deadT=0;maxX=P.x;
    cam.x=P.x-W*.4;cam.y=gy-H*.7;lastCamX=cam.x;lastBgCamX=cam.x;
    biomeIdx=0;biomeEnd=Infinity;
    pl.push({x:380,y:gy-80,w:110,h:40});
    pl.push({x:600,y:gy-160,w:110,h:40});
    pk.push({x:850,y:gy-30,vy:0,type:'pistol',picked:false});
    document.getElementById('score').textContent='📖 ТУТОРИАЛ';
    document.getElementById('dist').textContent='';
  } else if(sandboxMode){
    P.x=200;P.y=gy-P.h;P.vx=0;P.vy=0;P.g=true;P.hp=100;P.iv=60;P.f=1;P.dashTime=0;P.dashHits=[];P.bh=0;P.bhT=0;P.deadT=0;maxX=P.x;
    cam.x=P.x-W*.6+12;cam.y=gy-H*.7;lastCamX=cam.x;lastBgCamX=cam.x;
    biomeIdx=0;biomeEnd=Infinity;
    document.getElementById('score').textContent='Очки: 0';

    else if(e.t==='f'){X.fillStyle='#fff';X.beginPath();X.arc(sx+e.w/2,sy+e.h/2,8,0,6.28);X.fill();X.fillStyle='#000';X.beginPath();X.arc(sx+e.w/2,sy+e.h/2,4,0,6.28);X.fill();}
    else{X.fillStyle='#333';X.fillRect(sx+5,sy+8,e.w-10,10);}
    X.fillStyle='#000';X.fillRect(sx,sy-8,e.w,4);X.fillStyle='#f00';X.fillRect(sx,sy-8,e.w*(e.hp/e.mhp),4);}
}
function dR(){for(const r of rag){const sx=r.x-cam.x,sy=r.y-cam.y;if(sx<-100||sx>W+100)continue;X.save();X.translate(sx+r.w/2,sy+r.h/2);X.rotate(r.rot);X.globalAlpha=Math.min(1,r.life/40);X.fillStyle=r.c;X.fillRect(-r.w/2,-r.h/2,r.w,r.h);X.restore();X.globalAlpha=1;}}
function dB(){X.fillStyle='#fff';for(const b of bul)X.fillRect(b.x-cam.x-3,b.y-cam.y-3,6,6);X.fillStyle='#ff0';for(const b of bul)X.fillRect(b.x-cam.x-2,b.y-cam.y-2,4,4);X.fillStyle='#f0f';for(const b of eb)X.fillRect(b.x-cam.x-3,b.y-cam.y-3,6,6);}
function dPR(){for(const p of pt){X.globalAlpha=Math.min(1,p.life/20);X.fillStyle=p.c;X.fillRect(p.x-cam.x-p.size/2,p.y-cam.y-p.size/2,p.size,p.size);}X.globalAlpha=1;}
function dAtm(){
  for(const p of atm){
    if(p.t==='snow'){X.fillStyle='#fff';X.fillRect(p.x,p.y,p.size,p.size);}
    else if(p.t==='sand'){X.fillStyle='#c8b888';X.fillRect(p.x,p.y,p.size*2,p.size);}
    else if(p.t==='leaf'){X.fillStyle='#4a6a3a';X.save();X.translate(p.x,p.y);X.rotate(p.rot||0);X.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);X.restore();}
    else if(p.t==='ember'){X.fillStyle='#c85030';X.fillRect(p.x,p.y,p.size,p.size);}
    else if(p.t==='fly'){X.fillStyle='#000';X.beginPath();X.arc(p.x,p.y,p.size/2,0,6.28);X.fill();}
    else if(p.t==='star'){X.globalAlpha=.3+Math.sin(p.tw||0)*.3;X.fillStyle='#fff';X.fillRect(p.x,p.y,p.size,p.size);X.globalAlpha=1;}
  }
}
function dBg(){
  if(sandboxMode||tutorialMode)return;
  const gyc=gy-cam.y-60;
  for(const b of bg){
    if(b.x<-400||b.x>W+400)continue;
    const x=b.x,s=b.size,y=gyc-b.size*0.5;
    if(b.type==='house'||b.type==='cabin'||b.type==='stilthouse'||b.type==='adobe'){
      X.fillStyle=b.type==='cabin'?'#7a4a3a':b.type==='adobe'?'#a08060':b.type==='stilthouse'?'#5a4a3a':'#8a6a4a';
      X.fillRect(x-s*0.4,y,s*0.8,s*0.7);
      X.fillStyle='#3a2a1a';X.beginPath();X.moveTo(x-s*0.5,y);X.lineTo(x,y-s*0.35);X.lineTo(x+s*0.5,y);X.fill();
      X.fillStyle='#2a1a0a';X.fillRect(x-s*0.1,y+s*0.4,s*0.2,s*0.3);
      X.fillStyle='#ffc040';X.fillRect(x-s*0.3,y+s*0.15,s*0.12,s*0.12);X.fillRect(x+s*0.18,y+s*0.15,s*0.12,s*0.12);
    } else if(b.type==='well'||b.type==='deadwell'){
      X.fillStyle='#6a6a6a';X.fillRect(x-s*0.25,y+s*0.3,s*0.5,s*0.4);
      X.fillStyle='#3a2a1a';X.fillRect(x-s*0.3,y+s*0.3,s*0.6,s*0.05);
      X.fillRect(x-s*0.15,y-s*0.1,s*0.05,s*0.4);X.fillRect(x+s*0.1,y-s*0.1,s*0.05,s*0.4);
      X.fillStyle='#3a2a1a';X.beginPath();X.moveTo(x-s*0.35,y-s*0.05);X.lineTo(x,y-s*0.25);X.lineTo(x+s*0.35,y-s*0.05);X.fill();
    } else if(b.type==='fence'){
      X.fillStyle='#6a5a4a';for(let i=0;i<4;i++)X.fillRect(x-s*0.4+i*s*0.25,y+s*0.2,s*0.05,s*0.5);
      X.fillRect(x-s*0.4,y+s*0.35,s*0.85,s*0.05);X.fillRect(x-s*0.4,y+s*0.5,s*0.85,s*0.05);
    } else if(b.type==='barrel'){X.fillStyle='#5a4a3a';X.fillRect(x-s*0.15,y+s*0.15,s*0.3,s*0.5);X.fillStyle='#3a2a1a';X.fillRect(x-s*0.15,y+s*0.25,s*0.3,s*0.04);X.fillRect(x-s*0.15,y+s*0.5,s*0.3,s*0.04);}
    else if(b.type==='signpost'){X.fillStyle='#5a4a3a';X.fillRect(x-s*0.03,y-s*0.1,s*0.06,s*0.7);X.fillStyle='#8a6a4a';X.fillRect(x-s*0.3,y-s*0.15,s*0.6,s*0.2);X.fillStyle='#2a1a0a';X.fillRect(x-s*0.2,y-s*0.1,s*0.4,s*0.03);X.fillRect(x-s*0.2,y-s*0.02,s*0.3,s*0.03);}
    else if(b.type==='ruin'||b.type==='pillar'){X.fillStyle='#5a4a4a';X.fillRect(x-s*0.3,y-s*0.1,s*0.6,s*0.8);X.fillStyle='#3a2a2a';X.fillRect(x-s*0.35,y-s*0.15,s*0.7,s*0.1);}
    else if(b.type==='lamppost'){X.fillStyle='#333';X.fillRect(x-s*0.03,y-s*0.5,s*0.06,s*1.1);X.fillStyle='#ffc040';X.beginPath();X.arc(x,y-s*0.5,s*0.12,0,6.28);X.fill();}
  }
}
function dFg(){
  if(sandboxMode||tutorialMode)return;
  for(const f of fg){
    if(f.x<-350||f.x>W+350)continue;
    X.fillStyle='#0a0a0a';const s=f.size,x=f.x,y=f.sy,t=f.type;
    if(t==='tree'){X.fillRect(x-8,y-s*0.9,16,s*0.9);X.beginPath();X.moveTo(x-s*0.4,y-s*0.85);X.lineTo(x,y-s*1.35);X.lineTo(x+s*0.4,y-s*0.85);X.fill();X.beginPath();X.moveTo(x-s*0.3,y-s*1.1);X.lineTo(x,y-s*1.55);X.lineTo(x+s*0.3,y-s*1.1);X.fill();}
    else if(t==='bush'){X.beginPath();X.arc(x-s*0.22,y-s*0.15,s*0.26,0,6.28);X.arc(x+s*0.22,y-s*0.15,s*0.26,0,6.28);X.arc(x,y-s*0.32,s*0.3,0,6.28);X.fill();}
    else if(t==='snowtree'){X.fillRect(x-5,y-s*0.85,10,s*0.85);X.beginPath();X.moveTo(x-s*0.35,y-s*0.8);X.lineTo(x,y-s*1.4);X.lineTo(x+s*0.35,y-s*0.8);X.fill();}
    else if(t==='snowmound'){X.beginPath();X.arc(x,y,s*0.55,Math.PI,0);X.fill();}
    else if(t==='reed'){for(let i=-2;i<=2;i++){X.save();X.translate(x+i*10,y);X.rotate(i*0.08);X.fillRect(-2.5,-s,5,s);X.restore();}}
    else if(t==='deadtree'){X.fillRect(x-6,y-s*0.9,12,s*0.9);X.save();X.translate(x,y-s*0.75);X.rotate(-0.5);X.fillRect(0,-5,45,10);X.restore();X.save();X.translate(x,y-s*0.6);X.rotate(0.6);X.fillRect(0,-4,38,8);X.restore();}
    else if(t==='cactus'){X.fillRect(x-9,y-s,18,s);X.fillRect(x-9-s*0.3,y-s*0.75,s*0.3,10);X.fillRect(x+9,y-s*0.55,s*0.3,10);X.fillRect(x-9-s*0.3,y-s*0.75,7,s*0.45);X.fillRect(x+9,y-s*0.55,7,s*0.35);}
    else if(t==='rock'){X.beginPath();X.moveTo(x-s*0.5,y);X.lineTo(x-s*0.3,y-s*0.65);X.lineTo(x+s*0.15,y-s*0.75);X.lineTo(x+s*0.45,y-s*0.35);X.lineTo(x+s*0.5,y);X.fill();}
    else if(t==='skull'){X.beginPath();X.arc(x,y-s*0.4,s*0.4,0,6.28);X.fill();X.fillRect(x-s*0.22,y-s*0.15,s*0.44,s*0.4);X.fillStyle='#3a3a3a';X.beginPath();X.arc(x-s*0.15,y-s*0.42,s*0.08,0,6.28);X.arc(x+s*0.15,y-s*0.42,s*0.08,0,6.28);X.fill();}
    else if(t==='lavaRock'){X.beginPath();X.moveTo(x-s*0.5,y);X.lineTo(x-s*0.45,y-s*0.75);X.lineTo(x,y-s*0.9);X.lineTo(x+s*0.4,y-s*0.65);X.lineTo(x+s*0.5,y);X.fill();}
    else if(t==='obsidian'){X.beginPath();X.moveTo(x-s*0.32,y);X.lineTo(x-s*0.15,y-s*0.9);X.lineTo(x+s*0.1,y-s*1.1);X.lineTo(x+s*0.32,y-s*0.5);X.lineTo(x+s*0.35,y);X.fill();}
    else if(t==='darktree'){X.fillRect(x-7,y-s*0.9,14,s*0.9);X.beginPath();X.moveTo(x-s*0.4,y-s*0.85);X.lineTo(x,y-s*1.4);X.lineTo(x+s*0.4,y-s*0.85);X.fill();X.beginPath();X.moveTo(x-s*0.3,y-s*1.1);X.lineTo(x,y-s*1.55);X.lineTo(x+s*0.3,y-s*1.1);X.fill();}
    else if(t==='tomb'){X.fillRect(x-s*0.3,y-s*0.7,s*0.6,s*0.7);X.beginPath();X.arc(x,y-s*0.7,s*0.3,Math.PI,0);X.fill();X.fillStyle='#3a3a3a';X.fillRect(x-3,y-s*0.5,6,14);X.fillRect(x-8,y-s*0.4,16,4);}
  }
}
function dBossOverlay(){
  if(!boss)return;
  const dist=P.x-boss.x;
  if(dist<2500){
    const intensity=Math.max(0,Math.min(0.4,(1-dist/2500)*0.45));
    const g=X.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.9);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(120,0,0,${intensity})`);
    X.fillStyle=g;X.fillRect(0,0,W,H);
  }
}
function renderTutorial(){
  if(!tutorialMode)return;
  const msg=TUT_MSGS[Math.min(tutorialStep,TUT_MSGS.length-1)];
  X.fillStyle='rgba(0,0,0,0.85)';
  X.fillRect(W/2-340,20,680,90);
  X.strokeStyle='#ff0';X.lineWidth=3;
  X.strokeRect(W/2-340,20,680,90);
  X.textAlign='center';
  X.fillStyle='#ff0';
  X.font='bold 22px monospace';
  X.fillText(msg,W/2,58);
  X.fillStyle='#aaa';
  X.font='13px monospace';
  X.fillText('ШАГ '+(Math.min(tutorialStep+1,TUT_MSGS.length))+' / '+TUT_MSGS.length,W/2,85);
}
function tick(){up();ue();ub();upr();upk();ua();uc();upFg();upBg();uh();shake*=.88;if(shake<.1)shake=0;}
function previewTick(){cam.x+=2.5;lastCamX=cam.x-2.5;lastBgCamX=cam.x-2.5;upFg();upBg();ua();ext();cln();chkBiome();if(cam.x>maxX)maxX=cam.x;for(let i=pt.length-1;i>=0;i--){const p=pt[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.98;p.life--;if(p.life<=0)pt.splice(i,1);}}
function render(){X.clearRect(0,0,W,H);X.save();if(shake>0.1&&isFinite(shake))X.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  dwld();dBg();dBoss();dpl();dDecos();dHut();dHeal();dPU();dR();dE();dP();dB();dPR();dAtm();dFg();dBossOverlay();X.restore();renderTutorial();}
let lastT=0,acc=0;const STEP=16.67;
function loop(now){requestAnimationFrame(loop);if(!lastT)lastT=now;let d=now-lastT;lastT=now;if(d>100)d=100;if(d<0)d=0;
  if(!started){acc+=d;let s=0;while(acc>=STEP&&s++<10){previewTick();acc-=STEP;}}
  else if(!paused){acc+=d;let s=0;while(acc>=STEP&&s++<10){tick();acc-=STEP;}}
  else acc=0;
  render();}
bl();uw();loop();
</script></body></html>
